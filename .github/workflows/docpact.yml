name: docpact

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Biaoo/docpact@v0.1.4
        with:
          version: 0.1.4
          args: >
            validate-config --root . --strict

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Biaoo/docpact@v0.1.4
        with:
          version: 0.1.4
          args: >
            lint --root . --base ${{ github.event.pull_request.base.sha }} --head ${{ github.sha }} --mode enforce

  email-auth-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Fixed email-cache contracts
        run: deno test --no-config scripts/email_auth_cache_test.ts
      - name: Offline handler and email-log contracts
        run: >-
          deno test --no-config --import-map scripts/fixtures/email_auth/import_map.json --allow-env --allow-read=supabase/functions,scripts/fixtures/email_auth --deny-net scripts/email_auth_callers_test.ts

      - name: Isolated log routing contract
        run: >-
          deno test --no-config --import-map scripts/fixtures/email_auth/import_map.json --allow-env=OPENSEARCH_LOG_INDEX_NAME,OPENSEARCH_REGION,OPENSEARCH_DOMAIN --deny-net scripts/isolated_function_log_test.ts
      - name: Offline live-qualification target and request guards
        run: |
          python3 scripts/live_edge/test_safety.py
          python3 scripts/live_edge/crossref_check.py --self-test
      - name: Offline provider-probe ownership and cleanup contracts
        run: >-
          deno test --no-lock --config supabase/functions/deno.json --allow-env --allow-sys=osRelease --deny-net scripts/live_edge/probe_test.ts
